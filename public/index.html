<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2440" />
    <meta name="description" content="Encuesta integral de experiencia YAAVS. Tu opinión nos ayuda a mejorar." />
    <title>Encuesta de experiencia · YAAVS</title>
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="grid-glow"></div>
    </div>

    <header class="topbar">
      <div class="brand">
        <img src="./assets/logo-yaavs.png" alt="YAAVS" class="brand-logo" width="120" height="36" />
      </div>
      <div class="progress-wrap" id="progressWrap" hidden>
        <div class="progress-meta">
          <span id="progressLabel">Paso 1</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </header>

    <main class="stage" id="app"></main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script>
      // Candado temprano: si ya contestó, no carga el cuestionario otra vez.
      (function () {
        var KEY = "yaavs_nps_submitted_v1";
        var locked = false;
        try {
          locked = localStorage.getItem(KEY) === "1" || sessionStorage.getItem(KEY) === "1";
        } catch (e) {}
        if (!locked && /(?:^|; )yaavs_nps_submitted_v1=1(?:;|$)/.test(document.cookie)) locked = true;
        if (!locked) return;
        document.addEventListener("DOMContentLoaded", function () {
          var app = document.getElementById("app");
          if (!app) return;
          app.innerHTML =
            '<section class="card success step">' +
            '<div class="success-icon">✓</div>' +
            '<h2 class="question-title">Ya respondiste esta encuesta</h2>' +
            '<p class="lead">Desde este navegador ya se envió una respuesta y no se puede volver a contestar.</p>' +
            "</section>";
        });
        window.__YAAVS_NPS_LOCKED__ = true;
      })();
    </script>
    <script src="./config.js?v=20260808c"></script>
    <script src="./app.js?v=20260808c" defer></script>
  </body>
</html>
