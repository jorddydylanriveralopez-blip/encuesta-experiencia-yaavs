<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2440" />
    <meta name="description" content="Encuesta integral de experiencia YAAVS. Tu opinión nos ayuda a mejorar." />
    <title>Encuesta de experiencia · YAAVS</title>
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="grid-glow"></div>
    </div>

    <header class="topbar">
      <div class="brand">
        <img src="./assets/logo-yaavs.png" alt="YAAVS" class="brand-logo" width="120" height="36" />
      </div>
      <div class="progress-wrap" id="progressWrap" hidden>
        <div class="progress-meta">
          <span id="progressLabel">Paso 1</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </header>

    <main class="stage" id="app"></main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="./config.js"></script>
    <script src="./app.js" defer></script>
  </body>
</html>
