<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#002068" />
    <meta name="description" content="Encuesta integral de experiencia YAAVS. Tu opinión nos ayuda a mejorar." />
    <title>Encuesta de experiencia · YAAVS</title>
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <link rel="stylesheet" href="./styles-card6.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="aurora"></div>
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="orb orb-c"></div>
      <div class="grid-glow"></div>
    </div>

    <header class="topbar">
      <div class="brand">
        <img src="./assets/logo-yaavs-white.png" alt="YAAVS" class="brand-logo" width="200" height="70" />
      </div>
      <div class="progress-wrap" id="progressWrap" hidden>
        <div class="progress-meta">
          <span id="progressLabel">Paso 1</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </header>

    <main class="stage" id="app"></main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="./config.js?v=20260821oport"></script>
    <script>
      // Candado temprano: desactivado mientras allowRetake esté activo en config.
      (function () {
        var COUNT_KEY = "yaavs_nps_submit_count_v2";
        var LEGACY = "yaavs_nps_submitted_v1";
        var MAX = 1;
        var allowRetake = !(window.YAAVS_NPS_CONFIG && window.YAAVS_NPS_CONFIG.allowRetake === false);
        if (allowRetake) return;
        var count = 0;
        try {
          count = Number(localStorage.getItem(COUNT_KEY) || sessionStorage.getItem(COUNT_KEY) || 0) || 0;
          if (!count && (localStorage.getItem(LEGACY) === "1" || sessionStorage.getItem(LEGACY) === "1")) count = 1;
        } catch (e) {}
        if (!count) {
          var m = document.cookie.match(/(?:^|; )yaavs_nps_submit_count_v2=([^;]*)/);
          if (m) count = Number(decodeURIComponent(m[1])) || 0;
          else if (/(?:^|; )yaavs_nps_submitted_v1=1(?:;|$)/.test(document.cookie)) count = 1;
        }
        if (count < MAX) return;
        document.addEventListener("DOMContentLoaded", function () {
          var app = document.getElementById("app");
          if (!app) return;
          app.innerHTML =
            '<section class="card success step">' +
            '<div class="success-icon">✓</div>' +
            '<h2 class="question-title">Ya respondiste esta encuesta</h2>' +
            '<p class="lead">Desde este navegador ya se registró una respuesta y no se puede volver a contestar.</p>' +
            "</section>";
        });
        window.__YAAVS_NPS_LOCKED__ = true;
      })();
    </script>
    <script src="./app.js?v=20260821oport" defer></script>
  </body>
</html>
