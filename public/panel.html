<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2440" />
    <title>Panel de respuestas · YAAVS</title>
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
    </div>

    <header class="topbar">
      <div class="brand">
        <img src="./assets/logo-yaavs.png" alt="YAAVS" width="110" height="33" />
        <span class="brand-sub">Panel de respuestas</span>
      </div>
      <a class="link-form" href="./">Ir al cuestionario</a>
    </header>

    <main class="panel-stage">
      <section class="panel-shell" id="panelRoot">
        <p class="loading">Cargando respuestas…</p>
      </section>
    </main>

    <script src="./panel.js" defer></script>
  </body>
</html>
